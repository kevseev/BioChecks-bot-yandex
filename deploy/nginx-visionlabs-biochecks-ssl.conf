# Пример для /etc/nginx/sites-available/
#
# Цепочка:
#   клиент → :443 (TLS) → nginx терминирует TLS → http://127.0.0.1:80
#   Docker compose: 127.0.0.1:80:8080 → uvicorn в контейнере на 8080
#
# Если меняете WEB_PUBLISH_PORT — поменяйте порт в proxy_pass ниже.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name visionlabs.ru *.visionlabs.ru;

    ssl_certificate     /etc/nginx/ssl/visionlabs.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/visionlabs.ru/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 80m;

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
