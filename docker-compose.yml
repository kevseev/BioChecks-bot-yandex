services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      YANDEX_OFFSET_FILE: /data/yandex_updates_offset.txt
    volumes:
      - bot_state:/data
    # Luna на хосте: в .env укажите LUNA_BASE_URL=http://host.docker.internal:5000/6
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  bot_state:
